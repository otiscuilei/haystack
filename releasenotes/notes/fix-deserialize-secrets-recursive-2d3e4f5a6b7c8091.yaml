---
fixes:
  - |
    Fixed ``deserialize_secrets_inplace(..., recursive=True)`` failing to
    deserialize secrets. Because a serialized secret is itself a dictionary, the
    recursive branch walked into it instead of deserializing it, so a matched key
    was left as a raw dict; the recursive call also dropped the ``recursive`` flag,
    so nesting deeper than one level was never traversed. Matched keys are now
    deserialized at any depth.
